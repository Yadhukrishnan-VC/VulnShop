{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div style="max-width:420px;margin:2rem auto">
  <div class="card">
    <h2 style="color:#0d2b55;margin-bottom:1rem">Create Account</h2>
    <div class="alert alert-warning" style="font-size:0.8rem">
      <strong>Vulnerabilities:</strong> No CSRF · No CAPTCHA · No email verification · Reflected XSS in username · Weak passwords accepted
    </div>
    <form method="post" action="/register/">
      <!-- VULN: no csrf_token -->
      <div class="form-group">
        <label>Username <span class="vuln-tag high">XSS</span></label>
        <input type="text" name="username" placeholder='Try: <script>alert(1)</script>' required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password <span class="vuln-tag medium">No policy</span></label>
        <input type="password" name="password" placeholder="Any password works (even 1 char)">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
    </form>
    <div style="margin-top:1rem;text-align:center;font-size:0.88rem">
      <a href="/login/">Already have an account?</a>
    </div>
  </div>
</div>
{% endblock %}
